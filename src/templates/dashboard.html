<!DOCTYPE html>
<html lang="en">
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta charset="utf-8">
        <meta name="description" content="Scoutify - Business Contact Scraper App">
        <style>
            .hidden { display: none !important; }

            body {
            background-color: #0d1117;   
            color:	#e6edf3;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
            text-align: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
            
            }

            .btn{
                padding-top: 8px;
                padding-bottom:8px;
                background-color: #0d1117;

                border:#e6edf3 solid 2px;
                border-radius: 18px;

                color :#e6edf3;

                padding-left: 19px;
                padding-right:19px;
                display: inline;
                font-size: 15px;
                 
            }
            .btn:hover{
                background-color:#e6edf3;
                color:#0d1117;
                cursor: pointer;
                /*box-shadow: 1px 1px 17px 1px #e6edf3;*/
            }
            
            .btn2{
                padding-top: 8px;
                padding-bottom:8px;
                padding-left: 15px;
                padding-right:15px;
                display: inline;

                background-color: #0d1117;

                border:#e6edf3 solid 2px;
                border-radius: 18px;

                color :#e6edf3;

                font-size: 15px;

            }
            .btn2:hover{
                background-color:#e6edf3;
                color:#0d1117;
                cursor: pointer;
                /*box-shadow: 1px 1px 17px 1px #e6edf3;*/
            }
            #form-filling-container{
                margin-top: 15px;
                border-color: rgb(69, 52, 224);
                /*background-color: aqua;*/
                   /* Limits how wide the container can get */
                margin: 15px auto 0 auto; /* Centers the container horizontally (keeps 15px top margin) */
                
            }
            .urlContainerClass {
                display: inline-block;
                border: 2px solid #e6edf3;
                margin: 5px;
                
                border-radius: 8px;
                width: 110px;         /* Use a fixed width to keep them uniform */
                height: 115px;        /* Height increased slightly to fit both text and button safely */
                padding: 8px 4px;     /* Small inner spacing */
                box-sizing: border-box; 
                vertical-align: top;  /* Keeps the boxes aligned cleanly at the top of each row */
                overflow: hidden;    /* Keeps contents from leaking outside the borders */
                
            }
            .urlContainerClass p {
                font-size: 15px;
                margin: 0 0 6px 0;
                line-height: 1.2;
                word-break: break-all;     /* Forces long URLs to split across lines */
                overflow-wrap: break-word; /* Back-up break rule for modern browsers */
                height: 52px;              /* Gives text a fixed area so button stays aligned */
                overflow: hidden;          /* Prevents extreme lengths from expanding box */
            }
            #added-urls{
                margin-top: 15px;
            }

            .activeFormButton{
                background-color: #e6edf3;
                color: #0d1117;
            }
            /* CSS Styles */
            .basic-input {
            width: 250px;           /* Sets the width */
            padding: 8px 12px;       /* Adds space inside the bar */
            font-size: 16px;         /* Makes text readable on mobile and desktop */
            border: 1px solid #e6edf3;  /* Light grey border line */
            border-radius: 4px;      /* Slightly rounds the corners */
            outline: none;           /* Removes the default thick browser outline */
            }

            /* Changes the border color when you click inside it */
            .basic-input:focus {
            border-color: #007bff;   /* Simple blue highlight */
            }

            #click-options{
                margin-top: 15px;
            }

            .simple-glow {
            /* Syntax: horizontal vertical blur spread color */
                box-shadow: 1px 1px 10px 1px #586578;
            }

            #addr_status{
                margin-bottom: 20px;
            }
        </style>
    </head>
    <body>
        <main>
            <h1>Scoutify</h1>
            <h2>Give URLs as Input</h2>
            <section>
                <form action="#" method="post" id="url-form">
                    <p>Scraping address takes some long time, since its using Local AI Model from your Computer.</p>
                    <label for="addr_status">Scrape Address also: </label>
                    <input type="checkbox" id="addr_status" name="addr_choice" value="true">

                    <div id="url-options">
                        <button class="btn" type="button" id="manual-url-option">Manual</button>
                        <button class="btn" type="button" id="url-file-option">Upload</button>
                    </div>

                    <div id="form-filling-container">
                        <div id="add-urls">
                            <label for="url">URL</label>
                            <input class="basic-input" id="url"
                            type="text"
                            name="url"
                            pattern="^(https?://)?(www\.)?([a-zA-Z0-9-]+\.)+[a-zA-Z]{2,}(/.*)?$"
                            placeholder="example.com,https://example.com"
                            >
                            <button class="btn" type="button" id="add-url">Add</button>
                        </div>
                        
                        <div id="add-urls-file" class="hidden">
                            <label for="url-file">Upload CSV (column: urls)</label>
                            <input class = "btn2" type="file" id="url-file" name="url-file" accept=".csv,text/csv">
                        </div>

                        <div id="click-options">
                            <button class="btn simple-glow hidden" type="submit" id="submit-btn">Generate</button>
                            
                            <button type="button" class="btn" id="clear-all-url" acti>
                                Clear
                            </button>
                        </div>
                        <div id="added-urls">

                        </div>


                    </div>
                </form>
            </section>
        </main>
        <script>
            const inputValue = document.getElementById("url");
            const fileValue = document.getElementById("url-file");
            const urlAddButton = document.getElementById("add-url");
            const urlMap = new Map();

            // by default setting address status to false
            urlMap.set("addr_status",false)

             // ----------
            let addr_choice = document.getElementById("addr_status")
            addr_choice.checked = false;
            addr_choice.addEventListener('change' ,(e)=>{
                
                if(e.target.checked){
                    urlMap.set("addr_status", true)
                }
                else{  
                    urlMap.set("addr_status" , false)
                }

            })
            
            // ----------

            const submitForm = document.getElementById("submit-btn");
            const urlFileOption = document.getElementById("url-file-option");
            const urlManualOption = document.getElementById("manual-url-option");
            const urlFileContainer = document.getElementById("add-urls-file");
            const urlManualContainer = document.getElementById("add-urls");
            const displayUrl = document.getElementById("added-urls");
            const clearAllUrl = document.getElementById("clear-all-url");
            const urlForm = document.getElementById('url-form');

            let formStatus = "manual";
            let urlCount = 0;

            // Initialize UI states
            submitForm.classList.add("hidden");
            clearAllUrl.classList.add("hidden");
            urlManualOption.classList.add("activeFormButton");


            function normalizeUrl(url) {
                if (!/^https?:\/\//i.test(url)) {
                    url = "https://" + url;
                }
                try {
                    const parsedUrl = new URL(url);
                    if (!["http:", "https:"].includes(parsedUrl.protocol)) return null;
                    if (!parsedUrl.hostname.includes(".") || parsedUrl.hostname.startsWith(".") || parsedUrl.hostname.endsWith(".")) return null;
                    return parsedUrl.href;
                } catch {
                    return null;
                }
            }

            function addUrlToMap() {
                const inputUrl = inputValue.value.trim();
                if (!inputValue.checkValidity()) {
                    inputValue.reportValidity();
                    return;
                }
                if (inputUrl) {
                    const normalizedUrl = normalizeUrl(inputUrl);
                    if (!normalizedUrl) {
                        alert("Please enter a valid URL.");
                        inputValue.value = "";
                        return;
                    }
                    if (!urlMap.has(normalizedUrl)) {
                        urlCount += 1;
                        urlMap.set(normalizedUrl, urlCount);

                        if (urlCount > 0) {
                            submitForm.classList.remove("hidden");
                            clearAllUrl.classList.remove("hidden");
                        }
                        inputValue.value = "";
                        
                        const urlContainer = document.createElement('div');
                        urlContainer.classList.add("urlContainerClass");
                        const newUrlText = document.createElement('p');
                        const removeButton = document.createElement('button');
                        
                        removeButton.textContent = "Remove";
                        removeButton.classList.add("btn2");
                        newUrlText.textContent = normalizedUrl;

                        displayUrl.appendChild(urlContainer);
                        urlContainer.appendChild(newUrlText);
                        urlContainer.appendChild(removeButton);

                        removeButton.addEventListener('click', () => {
                            urlMap.delete(normalizedUrl);
                            urlCount -= 1;
                            urlContainer.remove();
                            
                            // Hide buttons if empty again
                            if (urlMap.size === 0) {
                                submitForm.classList.add("hidden");
                                clearAllUrl.classList.add("hidden");
                            }
                        });
                    } else {
                        inputValue.value = "";
                    }
                }
            }

            inputValue.addEventListener("keydown", (e) => {
                if (e.key == "Enter") {
                    e.preventDefault();
                    addUrlToMap();
                }
            });

            urlAddButton.addEventListener('click', addUrlToMap);

            fileValue.addEventListener('change', () => {
                const hasFile = fileValue.files.length > 0;
                submitForm.classList.toggle("hidden", !hasFile);
                clearAllUrl.classList.toggle("hidden", !hasFile);
            });

            urlFileOption.addEventListener('click', () => {
                if (formStatus === "manual") {
                    formStatus = "file";
                    urlFileContainer.classList.remove("hidden");
                    urlManualContainer.classList.add("hidden");
                    urlManualOption.classList.remove("activeFormButton");
                    urlFileOption.classList.add("activeFormButton");
                    displayUrl.classList.add("hidden");
                    displayUrl.replaceChildren();
                    urlMap.clear();
                    urlCount = 0;
                    fileValue.value = "";
                    submitForm.classList.add("hidden");
                    clearAllUrl.classList.remove("hidden");
                }
            });

            urlManualOption.addEventListener('click', () => {
                if (formStatus === "file") {
                    formStatus = "manual";
                    urlFileContainer.classList.add("hidden");
                    urlManualContainer.classList.remove("hidden");
                    urlManualOption.classList.add("activeFormButton");
                    urlFileOption.classList.remove("activeFormButton");
                    displayUrl.classList.remove("hidden");
                    if (urlMap.size === 0) {
                        submitForm.classList.add("hidden");
                        clearAllUrl.classList.add("hidden");
                    }
                }
            });

            clearAllUrl.addEventListener('click', (event) => {
                event.preventDefault();
                submitForm.classList.add("hidden");
                if (formStatus == "manual") {
                    urlMap.clear();
                    urlCount = 0;
                    displayUrl.replaceChildren();
                    inputValue.value = "";
                } else if (formStatus == "file") {
                    fileValue.value = "";
                }
                clearAllUrl.classList.add("hidden");
            });

            function parseCsvRows(text) {
                const rows = [];
                let row = [];
                let field = "";
                let inQuotes = false;

                for (let i = 0; i < text.length; i += 1) {
                    const character = text[i];

                    if (inQuotes) {
                        if (character === '"' && text[i + 1] === '"') {
                            field += '"';
                            i += 1;
                        } else if (character === '"') {
                            inQuotes = false;
                        } else {
                            field += character;
                        }
                    } else if (character === '"' && field.length === 0) {
                        inQuotes = true;
                    } else if (character === ',') {
                        row.push(field);
                        field = "";
                    } else if (character === '\n' || character === '\r') {
                        if (character === '\r' && text[i + 1] === '\n') {
                            i += 1;
                        }
                        row.push(field);
                        rows.push(row);
                        row = [];
                        field = "";
                    } else {
                        field += character;
                    }
                }

                if (inQuotes) {
                    throw new Error("The CSV file contains an unclosed quoted field.");
                }
                if (field.length > 0 || row.length > 0) {
                    row.push(field);
                    rows.push(row);
                }

                //returns a list of urls
                return rows;
            }

            function extractCsvUrls(text) {
                const rows = parseCsvRows(text);
                if (rows.length < 2) {
                    throw new Error('The CSV must contain a "urls" header and at least one URL.');
                }

                const headers = rows[0].map((header, index) =>
                    (index === 0 ? header.replace(/^\uFEFF/, "") : header).trim().toLowerCase()
                );
                const urlColumn = headers.indexOf("urls");
                if (urlColumn === -1) {
                    throw new Error('The CSV must have a column named "urls".');
                }

                const urls = [];
                const invalidRows = [];
                const seen = new Set();

                rows.slice(1).forEach((row, index) => {
                    const value = (row[urlColumn] || "").trim();
                    if (!value) return;

                    const normalizedUrl = normalizeUrl(value);
                    if (!normalizedUrl) {
                        invalidRows.push(index + 2);
                    } else if (!seen.has(normalizedUrl)) {
                        seen.add(normalizedUrl);
                        urls.push(normalizedUrl);
                    }
                });

                if (invalidRows.length > 0) {
                    throw new Error(`Invalid URL(s) in CSV row(s): ${invalidRows.join(", ")}.`);
                }
                if (urls.length === 0) {
                    throw new Error("No URLs were found in the CSV file.");
                }
                return urls;
            }

            async function startScraping(urlMapObj) {
                const response = await fetch('/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(urlMapObj)
                });

                if (!response.ok) {
                    throw new Error(`Could not start scraping (HTTP ${response.status}).`);
                }

                const result = await response.json();
                if (!result.job_id) {
                    throw new Error("The server did not return a scraping job ID.");
                }
                window.location.href = '/loading/' + encodeURIComponent(result.job_id);
            }

            // Fixed Submission Logic
            urlForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                
                if (formStatus === 'manual' && urlMap.size > 0) {
                    //covering map to list

                    const urlMapJson = Object.fromEntries(urlMap)

                    try {
                        submitForm.disabled = true;
                        submitForm.textContent = "Loading...";
                        await startScraping(urlMapJson);
                    } catch (error) {
                        console.error(error);
                        alert(error.message || "An error occurred while starting the scrape.");
                    } finally {
                        submitForm.disabled = false;
                        submitForm.textContent = "Generate";
                    }
                } 
                else if (formStatus === 'file') {
                    const file = fileValue.files[0];
                    if (!file) {
                        alert("Choose a CSV file first.");
                        return;
                    }
                    if (!file.name.toLowerCase().endsWith(".csv")) {
                        alert("Please choose a .csv file. The upload expects a column named \"urls\".");
                        return;
                    }

                    try {
                        submitForm.disabled = true;
                        submitForm.textContent = "Loading...";
                        const urls = extractCsvUrls(await file.text());

                        urls.forEach((url, index) => {
                            urlMap.set(url, index + 1);
                        });
                        
                        const urlMapJson = Object.fromEntries(urlMap)

                        await startScraping(urlMapJson);
                    } catch (error) {
                        console.error(error);
                        alert(error.message || "Could not read the CSV file.");
                    } finally {
                        submitForm.disabled = false;
                        submitForm.textContent = "Generate";
                    }
                }
            });
        </script>
    </body>
</html>
